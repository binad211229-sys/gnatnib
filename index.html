<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Modern</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-indigo-600 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('shop')">
        <i class="fa-solid fa-bag-shopping text-2xl"></i>
        <span class="text-xl font-bold tracking-wide">TokoKita</span>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md">
        <div class="relative">
          <input type="text" id="searchInput" oninput="filterProducts()" 
            placeholder="Cari barang (misal: Sepatu, Smartwatch)..." 
            class="w-full pl-10 pr-4 py-2 rounded-full border-none text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-300">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
        </div>
      </div>

      <!-- Navigation Menu -->
      <div class="flex items-center space-x-4">
        <button onclick="switchTab('orders')" class="relative hover:text-indigo-200 font-medium transition">
          <i class="fa-solid fa-truck-fast text-lg mr-1"></i> Pesanan Saya
          <span id="orderBadge" class="hidden absolute -top-2 -right-3 bg-red-500 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="openCartModal()" class="relative hover:text-indigo-200 font-medium transition">
          <i class="fa-solid fa-cart-shopping text-lg mr-1"></i> Keranjang
          <span id="cartBadge" class="bg-yellow-400 text-gray-900 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="openAdminLoginModal()" class="bg-indigo-800 hover:bg-indigo-900 text-xs sm:text-sm px-3 py-1.5 rounded-lg transition font-semibold">
          <i class="fa-solid fa-user-gear mr-1"></i> Login Admin
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTENT CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- VIEW: SHOP / KATALOG PRODUK -->
    <section id="shopView">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Katalog Produk</h2>
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Produk akan di-render di sini via JavaScript -->
      </div>
    </section>

    <!-- VIEW: ORDERS (PELAKATAN PESANAN PELANGGAN) -->
    <section id="ordersView" class="hidden">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Status Pesanan Saya</h2>
      <div id="ordersList" class="space-y-4">
        <!-- Pesanan akan di-render di sini -->
      </div>
    </section>

    <!-- VIEW: ADMIN DASHBOARD -->
    <section id="adminView" class="hidden bg-white p-6 rounded-xl shadow-md border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Panel Admin</h2>
          <p class="text-sm text-gray-500">Kelola status pesanan pembeli</p>
        </div>
        <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg">
          Logout Admin
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-3 font-semibold">ID Pesanan</th>
              <th class="p-3 font-semibold">Produk</th>
              <th class="p-3 font-semibold">Total</th>
              <th class="p-3 font-semibold">Status Saat Ini</th>
              <th class="p-3 font-semibold">Ubah Status</th>
            </tr>
          </thead>
          <tbody id="adminOrderTable">
            <!-- Data pesanan admin -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL: KERANJANG BELANJA -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Keranjang Belanja</h3>
        <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="cartItems" class="space-y-3 max-h-60 overflow-y-auto mb-4 border-t border-b py-3">
        <!-- Item keranjang -->
      </div>
      <div class="flex justify-between items-center font-bold text-lg mb-4">
        <span>Total:</span>
        <span id="cartTotal" class="text-indigo-600">Rp 0</span>
      </div>
      <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold transition">
        Checkout Sekarang
      </button>
    </div>
  </div>

  <!-- MODAL: LOGIN ADMIN -->
  <div id="adminLoginModal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-gray-800">Login Administrator</h3>
        <button onclick="closeAdminLoginModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
          <input type="text" id="adminUser" placeholder="Username (admin)" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
          <input type="password" id="adminPass" placeholder="Password (1234)" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold transition">
          Masuk sebagai Admin
        </button>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // DATA PRODUK
    const products = [
      { id: 1, name: "Sepatu Sneaker Sporty", price: 350000, category: "sepatu", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
      { id: 2, name: "Smartwatch Fitness Tracker", price: 450000, category: "elektronik", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
      { id: 3, name: "Headphone Wireless Bass", price: 280000, category: "elektronik", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
      { id: 4, name: "Kemeja Casual Katun", price: 175000, category: "pakaian", image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500&q=80" },
      { id: 5, name: "Ransel Laptop Anti-Air", price: 230000, category: "tas", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" },
      { id: 6, name: "Kacamata Hitam Polarized", price: 120000, category: "aksesoris", image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&q=80" }
    ];

    let cart = [];
    let orders = [
      { id: "ORD-9821", name: "Headphone Wireless Bass", price: 280000, status: "Sedang Dikirim", date: "2026-08-11" }
    ];

    // INITIAL RENDER
    document.addEventListener("DOMContentLoaded", () => {
      renderProducts(products);
      updateBadges();
    });

    // RENDER CATALOG
    function renderProducts(items) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = items.length === 0 
        ? `<p class="col-span-full text-center text-gray-500 py-10">Barang tidak ditemukan.</p>`
        : items.map(p => `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
              <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
              <div class="p-4">
                <h3 class="font-bold text-gray-800 mb-1">${p.name}</h3>
                <p class="text-indigo-600 font-extrabold text-lg mb-3">Rp ${p.price.toLocaleString('id-ID')}</p>
                <button onclick="addToCart(${p.id})" class="w-full bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-600 font-semibold py-2 rounded-lg transition border border-indigo-200">
                  + Keranjang
                </button>
              </div>
            </div>
          `).join('');
    }

    // SEARCH FILTER
    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    // KERANJANG SYSTEM
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      cart.push(product);
      updateBadges();
      alert(`"${product.name}" berhasil ditambahkan ke keranjang!`);
    }

    function updateBadges() {
      document.getElementById("cartBadge").innerText = cart.length;
      document.getElementById("orderBadge").innerText = orders.length;
      if (orders.length > 0) document.getElementById("orderBadge").classList.remove("hidden");
    }

    function openCartModal() {
      const cartItems = document.getElementById("cartItems");
      let total = 0;
      cartItems.innerHTML = cart.length === 0 
        ? `<p class="text-center text-gray-400 py-4">Keranjang Anda kosong.</p>`
        : cart.map((item, index) => {
            total += item.price;
            return `
              <div class="flex justify-between items-center text-sm">
                <div>
                  <p class="font-semibold">${item.name}</p>
                  <p class="text-gray-500">Rp ${item.price.toLocaleString('id-ID')}</p>
                </div>
                <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-xs">Hapus</button>
              </div>
            `;
          }).join('');
      document.getElementById("cartTotal").innerText = `Rp ${total.toLocaleString('id-ID')}`;
      document.getElementById("cartModal").classList.remove("hidden");
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      openCartModal();
      updateBadges();
    }

    function closeCartModal() {
      document.getElementById("cartModal").classList.add("hidden");
    }

    // CHECKOUT SYSTEM
    function checkout() {
      if (cart.length === 0) return alert("Keranjang kosong!");
      
      cart.forEach(item => {
        orders.push({
          id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
          name: item.name,
          price: item.price,
          status: 'Sedang Dikirim',
          date: new Date().toISOString().split('T')[0]
        });
      });

      cart = [];
      updateBadges();
      closeCartModal();
      alert("Checkout berhasil! Barang Anda sedang dikirim.");
      switchTab('orders');
    }

    // TAB SWITCHER
    function switchTab(tab) {
      document.getElementById("shopView").classList.add("hidden");
      document.getElementById("ordersView").classList.add("hidden");
      document.getElementById("adminView").classList.add("hidden");

      if (tab === 'shop') {
        document.getElementById("shopView").classList.remove("hidden");
      } else if (tab === 'orders') {
        document.getElementById("ordersView").classList.remove("hidden");
        renderOrders();
      } else if (tab === 'admin') {
        document.getElementById("adminView").classList.remove("hidden");
        renderAdminOrders();
      }
    }

    // RENDER ORDERS FOR USER
    function renderOrders() {
      const container = document.getElementById("ordersList");
      container.innerHTML = orders.length === 0
        ? `<div class="bg-white p-6 rounded-xl text-center text-gray-500">Belum ada pesanan aktif.</div>`
        : orders.map(o => `
            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-wrap justify-between items-center gap-4">
              <div>
                <span class="text-xs font-mono bg-gray-100 px-2 py-1 rounded text-gray-600">${o.id}</span>
                <h4 class="font-bold text-gray-800 mt-1">${o.name}</h4>
                <p class="text-sm text-gray-500">Tanggal: ${o.date} | Total: Rp ${o.price.toLocaleString('id-ID')}</p>
              </div>
              <div>
                <span class="px-3 py-1.5 rounded-full text-xs font-bold ${
                  o.status === 'Sedang Dikirim' ? 'bg-blue-100 text-blue-700' :
                  o.status === 'Diproses' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'
                }">
                  <i class="fa-solid ${o.status === 'Sedang Dikirim' ? 'fa-truck' : 'fa-check'} mr-1"></i> ${o.status}
                </span>
              </div>
            </div>
          `).join('');
    }

    // ADMIN SYSTEM
    function openAdminLoginModal() {
      document.getElementById("adminLoginModal").classList.remove("hidden");
    }

    function closeAdminLoginModal() {
      document.getElementById("adminLoginModal").classList.add("hidden");
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById("adminUser").value;
      const pass = document.getElementById("adminPass").value;

      if (user === "admin" && pass === "1234") {
        closeAdminLoginModal();
        switchTab('admin');
        alert("Login Admin Berhasil!");
      } else {
        alert("Username atau Password Admin salah! (Gunakan: admin / 1234)");
      }
    }

    function renderAdminOrders() {
      const table = document.getElementById("adminOrderTable");
      table.innerHTML = orders.map((o, index) => `
        <tr class="border-b text-sm">
          <td class="p-3 font-mono">${o.id}</td>
          <td class="p-3 font-semibold">${o.name}</td>
          <td class="p-3">Rp ${o.price.toLocaleString('id-ID')}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded text-xs font-bold ${
              o.status === 'Sedang Dikirim' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'
            }">${o.status}</span>
          </td>
          <td class="p-3">
            <select onchange="changeOrderStatus(${index}, this.value)" class="border rounded px-2 py-1 text-xs">
              <option value="Diproses" ${o.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
              <option value="Sedang Dikirim" ${o.status === 'Sedang Dikirim' ? 'selected' : ''}>Sedang Dikirim</option>
              <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    function changeOrderStatus(index, newStatus) {
      orders[index].status = newStatus;
      renderAdminOrders();
    }

    function logoutAdmin() {
      switchTab('shop');
    }
  </script>
</body>
</html>
